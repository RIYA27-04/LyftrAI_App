services:
  - type: web
    name: lyftrai-chat-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    rootDir: .
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        value: https://YOUR-VERCEL-APP.vercel.app
      - key: ENABLE_FAILURE_SIMULATION
        value: true
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
